zerops:
  - setup: python
    build:
      base: python@3.12
      buildCommands:
        - pip install -r requirements.txt --target ./app-packages
      deployFiles:
        - ./
      cache: app-packages
    run:
      base: python@3.12
      envVariables:
        PYTHONPATH: /var/www/app-packages
      ports:
        - port: 8000
          httpSupport: true
      start: python -m uvicorn main:app --host 0.0.0.0 --port 8000